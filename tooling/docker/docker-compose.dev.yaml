name: crowdboard-dev

services:
  db:
    image: postgres:17
    ports:
      - 5433:5432
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - dev-network
    environment:
      POSTGRES_DB: crowdboard
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: "pg_isready -U postgres -h localhost -d crowdboard"
      interval: 1m
      timeout: 30s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    container_name: crowdboard-dev_db

  reverse-proxy:
    image: caddy:2.11.4
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - dev-network
    restart: unless-stopped
    container_name: crowdboard-dev_reverse-proxy

volumes:
  db-data:
  caddy-data:
  caddy-config:

networks:
  dev-network:
    driver: bridge
